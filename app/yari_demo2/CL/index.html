<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ya-Risk Bilan</title>
<style>
:root{--g:#00915A;--gd:#00573F;--sec:#C6E5D4;--sub:#EAF5EF;--inp:#FFF8E1;--inpt:#1F4E9A;--txt:#1E2B26;--line:#D3DED8}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;font-family:Calibri,'Segoe UI',Arial,sans-serif;font-size:13.5px}
#app{padding:2px 2px 8px 2px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{border:1px solid #B7D3C3;background:#fff;color:var(--gd);padding:6px 14px;font:inherit;font-weight:700;cursor:pointer;border-radius:5px 5px 0 0;border-bottom:3px solid transparent}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.tabs button .cnt{display:inline-block;margin-left:6px;padding:0 6px;border-radius:9px;background:#FFC7CE;color:#9C0006;font-size:11.5px}
.tabs button.on .cnt{background:#fff}
.sp{flex:1}
.unit{display:flex;border:1px solid #B7D3C3;border-radius:5px;overflow:hidden}
.unit button{border:0;background:#fff;color:var(--gd);padding:5px 10px;font:inherit;cursor:pointer}
.unit button.on{background:var(--gd);color:#fff}
.fbar{display:grid;grid-template-columns:minmax(160px,260px) 1fr;border:1px solid #B7D3C3;border-radius:5px;background:#fff;color:var(--txt);margin-bottom:8px;min-height:38px}
.fbar .nm{background:var(--sub);color:var(--gd);font-weight:700;padding:7px 10px;border-right:1px solid #B7D3C3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbar .fx{padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.fbar .fx i{color:var(--g);font-style:italic;font-weight:700;margin-right:4px}
.fbar .fx .muted{color:#5B6B63}
.fbar input{font:inherit;padding:3px 6px;border:1px solid #9FBFAE;border-radius:4px;width:150px;text-align:right}
.fbar button,.pend button{font:inherit;padding:4px 10px;border-radius:4px;border:1px solid var(--gd);background:#fff;color:var(--gd);cursor:pointer}
.fbar button.pri,.pend button.pri{background:var(--gd);color:#fff}
.lv{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11.5px;font-weight:700}
.lv-OK{background:#E2F2E9;color:var(--gd)}.lv-LOW{background:#FFF2CC;color:#7A5C00}.lv-MEDIUM{background:#F8CBAD;color:#7A2E00}.lv-HIGH{background:#FFC7CE;color:#9C0006}
.pend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#FFF4E5;border:1px solid #ED7D31;color:#5A3200;border-radius:5px;padding:7px 10px;margin-bottom:8px}
.pend input{font:inherit;padding:4px 8px;border:1px solid #D9A77F;border-radius:4px;min-width:260px;flex:1}
.pend .err{color:#C00000;font-weight:700}
.wrap{overflow-x:auto;border:1px solid #B7D3C3;border-radius:6px;background:#fff}
table.yr{border-collapse:collapse;width:100%;min-width:620px;line-height:1.25}
table.yr td,table.yr th{border:1px solid var(--line);padding:5px 9px;vertical-align:middle}
table.yr th{font-weight:700;text-align:center}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:96px;position:relative;cursor:cell}
.h1{background:var(--g);color:#fff;font-weight:700}.h2{background:var(--gd);color:#fff;font-weight:700}
.sec{background:var(--sec);color:var(--gd);font-weight:700}.sub{background:var(--sub);color:var(--txt);font-weight:700}
.tot{background:var(--gd);color:#fff;font-weight:700}.row{background:#fff;color:var(--txt)}
.inp{background:var(--inp);color:var(--inpt)}
.idl{background:var(--sub);color:var(--gd);font-weight:700;white-space:nowrap}.idv{background:var(--inp);color:var(--inpt)}
td.al-LOW{background:#FFF2CC!important;color:var(--txt)!important;box-shadow:inset 0 0 0 2px #C9A227}
td.al-MEDIUM{background:#F8CBAD!important;color:var(--txt)!important;box-shadow:inset 0 0 0 2px #ED7D31}
td.al-HIGH{background:#FFC7CE!important;color:#9C0006!important;box-shadow:inset 0 0 0 3px #FF0000;font-weight:700}
td.corr::after{content:"";position:absolute;top:0;right:0;border-top:8px solid #7030A0;border-left:8px solid transparent}
td.pend::before{content:"";position:absolute;top:0;left:0;border-top:8px solid #ED7D31;border-right:8px solid transparent}
td.pend{font-style:italic}
td.sel{outline:2px solid #107C41;outline-offset:-2px;z-index:2}
td.ed{padding:0!important}
td.ed input{width:100%;height:100%;min-height:28px;border:2px solid #107C41;padding:4px 8px;font:inherit;text-align:right;background:#fff;color:#000;outline:none}
td.ed input.bad{border-color:#C00000;background:#FFEDED}
.ok-chk{background:#fff;color:var(--g);font-weight:700;text-align:center}.ko-chk{background:#fff;color:#C00000;font-weight:700;text-align:center}
.src{background:#fff;color:#5B6B63;font-size:11.5px;font-style:italic}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;margin:8px 0 0 0}
.leg span{display:inline-flex;align-items:center;gap:5px}
.leg i{display:inline-block;width:14px;height:14px;border:1px solid #9AA9A1;position:relative}
table.lst{border-collapse:collapse;width:100%;background:#fff;color:var(--txt)}
table.lst th{background:var(--g);color:#fff;text-align:left;padding:6px 9px}
table.lst td{border-bottom:1px solid var(--line);padding:6px 9px}
table.lst tr.click{cursor:pointer}table.lst tr.click:hover td{background:#F2F8F5}
h4{margin:12px 0 6px 0;color:var(--gd)}
.note{font-size:12px;color:#5B6B63;margin:8px 2px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.kpi div{background:#fff;border:1px solid #B7D3C3;border-left:4px solid var(--g);border-radius:5px;padding:6px 10px;color:var(--txt)}
.kpi b{display:block;font-size:17px;color:var(--gd)}
.kpi small{color:#5B6B63}
</style>
</head>
<body>
<div id="app"><div class="note">Chargement…</div></div>
<script>
(function () {
  "use strict";
  // ---------- Protocole composant Streamlit (sans dépendance npm) ----------

  }

  var A = null, VERSION = null, LASTSIG = null;
  var S = { tab: "ACTIF", unit: "KDZD", pending: {}, undo: [], sel: null, edit: null, motif: "", saving: false, msg: "" };
  var M = null; // modèle calculé

  window.addEventListener("message", function (ev) {
    var d = ev.data;

  if (window.ResizeObserver) new ResizeObserver(setHeight).observe(document.getElementById("app"));

  // ---------- Formats ----------
  function grp(s) { return s.replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
  function fd(v) { return v === null || v === undefined ? "" : grp(String(Math.round(v))); }
  function fu(v) {
    if (v === null || v === undefined) return "";
    var x = S.unit === "KDZD" ? v / 1000 : v;
    var r = Math.round(x);
    return r === 0 ? "0" : grp(String(r));
  }
  function editStr(v) {
    if (v === null || v === undefined) return "";
    var x = S.unit === "KDZD" ? v / 1000 : v;
    return String(Number(x.toFixed(S.unit === "KDZD" ? 3 : 2))).replace(".", ",");
  }
  function parseIn(s) {
    s = String(s || "").replace(/[\s  ]/g, "");
    if (s === "" || s === "-") return { ok: true, v: null };
    var neg = /^\(.*\)$/.test(s); s = s.replace(/[()]/g, "");
    if (s.indexOf(",") >= 0 && s.indexOf(".") < 0) s = s.replace(",", "."); else s = s.replace(/,/g, "");
    if (!/^[-+]?\d*\.?\d+$/.test(s)) return { ok: false };
    var x = Number(s); if (neg) x = -x;
    if (S.unit === "KDZD") x = x * 1000;
    return { ok: true, v: Math.round(x * 100) / 100 };
  }
  function esc(s) { return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function nz(v) { return v === null || v === undefined ? null : v; }

  // ---------- Données courantes = extraction (+ corrections enregistrées) + modifications en cours ----------
  function baseVal(t, r, c) { var x = ((A.data[t] || {})[r] || {})[c]; return nz(x); }
  function rowsOf(t) {
    var base = A.data[t] || {}, out = {}, r, k;
    for (r in base) out[r] = Object.assign({}, base[r]);
    for (k in S.pending) {
      var p = k.split(".");
      if (p[0] !== t) continue;
      out[p[1]] = out[p[1]] || {};
      if (S.pending[k].value === null) delete out[p[1]][p[2]]; else out[p[1]][p[2]] = S.pending[k].value;
    }
    return out;
  }
  function curVal(t, r, c) { var k = t + "." + r + "." + c; if (k in S.pending) return S.pending[k].value; return baseVal(t, r, c); }

  // ---------- Moteur de calcul (formules du modèle V20) ----------
  function level(g) {
    var a = Math.abs(g || 0), th = A.thresholds;
    if (a < th.min) return "OK"; if (a < th.medium) return "LOW"; if (a < th.high) return "MEDIUM"; return "HIGH";
  }
  function cmp(c, lab) {
    if (c.observed !== null && c.computed !== null) {
      var g = c.observed - c.computed; c.gap = g; c.level = level(g);
      if (c.level !== "OK") c.note = "Liasse " + fd(c.observed) + " · " + lab + " " + fd(c.computed) + " · écart " + fd(g) + " DZD";
    }
  }
  function computeBalance(t) {
    var sp = A.spec[t], R = rowsOf(t), out = {};
    function obs(r, c) { return nz((R[r] || {})[c]); }
    function leaf(r, col) {
      var k = r + "|" + col; if (out[k]) return out[k].value;
      var o = obs(r, col), c = { value: o, observed: o, computed: null, kind: "input", level: "OK", note: "" };
      if (t === "ACTIF" && col === "net_n") {
        var b = obs(r, "montant_brut"), a = obs(r, "amortissements_provisions_pertes");
        if (b !== null || a !== null) { c.kind = "formula"; c.computed = (b || 0) - (a || 0); c.value = c.computed; c.formula = "= Brut − Amortissements"; cmp(c, "Brut − Amort."); }
      }
      out[k] = c; return c.value;
    }
    function val(r, col) {
      var f = sp.formulas[r]; if (!f) return leaf(r, col);
      var k = r + "|" + col; if (out[k]) return out[k].value;
      var pres = [], i;
      for (i = 0; i < f.length; i++) { var v = val(f[i][0], col); if (v !== null) pres.push(v * f[i][1]); }
      var o = r.charAt(0) === "_" ? null : obs(r, col);
      var c = { value: null, observed: o, computed: null, kind: "formula", level: "OK", note: "" };
      c.formula = "= " + f.map(function (x, j) { return (j ? (x[1] < 0 ? " − " : " + ") : (x[1] < 0 ? "− " : "")) + (sp.labels[x[0]] || x[0]); }).join("");
      if (pres.length) { c.computed = pres.reduce(function (a, b) { return a + b; }, 0); c.value = c.computed; cmp(c, "Calculé"); }
      else { c.value = o; if (o !== null) c.note = "Composantes absentes : montant imprimé repris tel quel."; }

    }
    sp.layout.forEach(function (row) { sp.cols.forEach(function (col) { val(row[1], col); }); });
    return out;
  }
  function computeTCR() {
    var sp = A.spec.TCR, R = rowsOf("TCR"), out = {};
    function net(r, p) {
      var v = R[r] || {}, d = nz(v[p + "_debit"]), c = nz(v[p + "_credit"]);
      if (d === null && c === null) return null; return (c || 0) - (d || 0);
    }
    function f(r, p) {
      var k = r + "|" + p; if (out[k]) return out[k].value;
      var o = net(r, p), vals = R[r] || {}, c, fo = sp.formulas[r];
      if (fo) {
        c = { observed: o, kind: "formula", level: "OK", note: "", computed: null, value: null };
        c.formula = "= Σ (crédit − débit) : " + fo.map(function (x) { return sp.labels[x] || x; }).join(" + ");
        var parts = fo.map(function (x) { return f(x, p); }).filter(function (x) { return x !== null; });
        if (parts.length) {
          c.computed = parts.reduce(function (a, b) { return a + b; }, 0); c.value = c.computed; cmp(c, "Calculé");
          if (Math.abs(c.computed) > 1e-9) {
            var wc = p + (c.computed > 0 ? "_debit" : "_credit"), w = nz(vals[wc]);
            if (w !== null && Math.abs(w) > 1e-9) {
              c.level = "HIGH"; c.wrongSide = wc;
              c.note = (c.note ? c.note + " · " : "") + "Montant imprimé côté " + (c.computed > 0 ? "DÉBIT" : "CRÉDIT") + " alors que le solde recalculé est " + (c.computed > 0 ? "créditeur" : "débiteur");
            }
          }
        } else c.value = o;
      } else {
        c = { value: o, observed: o, kind: "input", level: "OK", note: "" };
        var e = sp.side[r];
        if (e) {
          var wc2 = p + (e === "DEBIT" ? "_credit" : "_debit"), w2 = nz(vals[wc2]);
          if (w2 !== null && Math.abs(w2) > 1e-9) { c.level = "HIGH"; c.wrongSide = wc2; c.note = "Montant " + fd(w2) + " DZD au " + (e === "DEBIT" ? "CRÉDIT" : "DÉBIT") + " ; sens attendu : " + e; }
        }
      }
      out[k] = c; return c.value;
    }
    sp.layout.forEach(function (row) { f(row[2], "n"); f(row[2], "n1"); });
    return out;
  }
  function V(t, r, c) { var m = t === "ACTIF" ? M.A : M.P, x = m[r + "|" + c]; return x ? x.value : null; }
  function T(r, p) { var x = M.T[r + "|" + p]; return x ? x.value : null; }

  function buildModel() {
    M = { A: computeBalance("ACTIF"), P: computeBalance("PASSIF"), T: computeTCR() };
    var y = A.year, cross = [], alerts = [];
    [["net_n", "n", y], ["net_n1", "n1", y ? y - 1 : null]].forEach(function (z) {
      var a = V("ACTIF", "total_general_actif", z[0]), p = V("PASSIF", "total_general_passif", z[1]);
      if (a !== null && p !== null) cross.push({ c: "Total actif = Total passif", y: z[2], a: a, b: p, g: a - p, lv: level(a - p), go: ["PASSIF", "total_general_passif", z[1]] });
      var rt = T("resultat_net_exercice", z[1]), rp = V("PASSIF", "resultat_net_passif", z[1]);
      if (rt !== null && rp !== null) cross.push({ c: "Résultat TCR = Résultat net au passif", y: z[2], a: rt, b: rp, g: rt - rp, lv: level(rt - rp), go: ["TCR", "resultat_net_exercice", z[1] + "_credit"] });
    });
    ["ACTIF", "PASSIF"].forEach(function (t) {
      var m = t === "ACTIF" ? M.A : M.P, sp = A.spec[t];
      Object.keys(m).forEach(function (k) {
        var c = m[k]; if (c.level === "OK") return; var p = k.split("|");
        alerts.push({ t: t, r: p[0], col: p[1], lab: sp.labels[p[0]], cl: sp.colLabels[p[1]], c: c });
      });
    });
    Object.keys(M.T).forEach(function (k) {
      var c = M.T[k]; if (c.level === "OK") return; var p = k.split("|");
      var col = c.wrongSide || (p[1] + ((c.value || 0) < 0 ? "_debit" : "_credit"));
      alerts.push({ t: "TCR", r: p[0], col: col, lab: A.spec.TCR.labels[p[0]], cl: A.spec.TCR.colLabels[col], c: c });
    });
    var ord = { HIGH: 0, MEDIUM: 1, LOW: 2 };
    alerts.sort(function (a, b) { return ord[a.c.level] - ord[b.c.level]; });
    M.cross = cross; M.alerts = alerts;
    M.nbAlerts = alerts.length + cross.filter(function (c) { return c.lv !== "OK"; }).length;
  }

  // ---------- Rendu des cellules ----------
  function corrOf(k) { return (A.corr || {})[k]; }
  function tdNum(t, r, col, c, style, editable) {
    var k = t + "." + r + "." + col, cls = ["n"];
    if (!c) c = { value: null, kind: "input", level: "OK" };
    if (c.kind === "input" && style === "row") cls.push("inp");
    else if (c.kind === "input" && style === "sub") cls.push("sub");
    else cls.push(style);
    if (c.level && c.level !== "OK") cls.push("al-" + c.level);
    if (corrOf(k)) cls.push("corr");
    if (k in S.pending) cls.push("pend");
    if (S.sel === k) cls.push("sel");
    var tip = [];
    if (c.note) tip.push(c.note);
    var co = corrOf(k); if (co) tip.push("Corrigé le " + String(co.date || "").slice(0, 10) + " — " + (co.motif || ""));
    if (k in S.pending) tip.push("Modification non enregistrée");
    return '<td class="' + cls.join(" ") + '" data-k="' + k + '" data-e="' + (editable ? 1 : 0) + '"' + (tip.length ? ' title="' + esc(tip.join(" | ")) + '"' : "") + ">" + fu(c.value) + "</td>";
  }
  function identRows(t, n) {
    return (A.ident[t] || []).map(function (x) { return '<tr><td class="idl">' + esc(x[0]) + '</td><td class="idv" colspan="' + n + '">' + esc(x[1]) + "</td></tr>"; }).join("");
  }
  function renderActif() {
    var sp = A.spec.ACTIF, y = A.year, u = S.unit;
    var h = '<div class="wrap"><table class="yr"><colgroup><col style="width:36%"><col style="width:16%"><col style="width:16%"><col style="width:16%"><col style="width:16%"></colgroup>';
    h += identRows("ACTIF", 4);
    h += '<tr><th class="h1" rowspan="2" style="text-align:left;font-size:15px">ACTIF</th><th class="h2" colspan="3">Fiscal — exercice ' + (y || "N") + '</th><th class="h2">Fiscal — ' + (y ? y - 1 : "N-1") + "</th></tr>";
    h += '<tr><th class="h1">Montants bruts<br>(' + u + ')</th><th class="h1">Amort., provisions et pertes de valeur<br>(' + u + ')</th><th class="h1">Net<br>(' + u + ')</th><th class="h1">Net<br>(' + u + ")</th></tr>";
    sp.layout.forEach(function (row) {
      var lbl = row[0], r = row[1], st = row[2];
      h += '<tr><td class="' + st + '">' + esc(lbl) + "</td>";
      sp.cols.forEach(function (col) { var c = M.A[r + "|" + col]; h += tdNum("ACTIF", r, col, c, st, c && c.kind === "input" && r.charAt(0) !== "_"); });
      h += "</tr>";
    });
    return h + "</table></div>";
  }
  function renderPassif() {
    var sp = A.spec.PASSIF, y = A.year, u = S.unit;
    var h = '<div class="wrap"><table class="yr" style="max-width:920px"><colgroup><col style="width:56%"><col style="width:22%"><col style="width:22%"></colgroup>';
    h += identRows("PASSIF", 2);
    h += '<tr><th class="h1" style="text-align:left;font-size:15px">PASSIF</th><th class="h1">' + (y || "N") + "<br>(" + u + ')</th><th class="h1">' + (y ? y - 1 : "N-1") + "<br>(" + u + ")</th></tr>";
    sp.layout.forEach(function (row) {
      var lbl = row[0], r = row[1], st = row[2];
      h += '<tr><td class="' + st + '">' + esc(lbl) + "</td>";
      sp.cols.forEach(function (col) { var c = M.P[r + "|" + col]; h += tdNum("PASSIF", r, col, c, st, c && c.kind === "input" && r.charAt(0) !== "_"); });
      h += "</tr>";
    });
    h += '<tr><td class="row" style="font-style:italic">Contrôle Actif = Passif</td>';
    [["net_n", "n"], ["net_n1", "n1"]].forEach(function (z) {
      var a = V("ACTIF", "total_general_actif", z[0]), p = V("PASSIF", "total_general_passif", z[1]);
      if (a === null || p === null) h += '<td class="row"></td>';
      else if (Math.abs(a - p) < A.thresholds.min) h += '<td class="ok-chk">OK (Actif = Passif)</td>';
      else h += '<td class="ko-chk">ERREUR (Actif ≠ Passif)<br>' + fu(a - p) + "</td>";
    });
    h += '</tr><tr><td class="src" colspan="3">(1) à utiliser uniquement pour la présentation d’états financiers consolidés</td></tr>';
    return h + "</table></div>";
  }
  function renderTCR() {
    var sp = A.spec.TCR, y = A.year, u = S.unit, L = sp.layout, spans = {}, i = 0;
    while (i < L.length) {
      if (L[i][0] && L[i][1]) { var j = i + 1; while (j < L.length && L[j][0] === null) j++; spans[i] = j - i; i = j; } else i++;
    }

    setPending(k, r.v);
    if (move) moveSel(move); else render();
    return true;
  }
  function cancelEdit() { S.edit = null; render(); }
  function grid() {
    var rows = [];
    document.querySelectorAll("table.yr tr").forEach(function (tr) {
      var cells = Array.prototype.slice.call(tr.querySelectorAll("td[data-k]"));
      if (cells.length) rows.push(cells.map(function (td) { return td.getAttribute("data-k"); }));
    });
    return rows;
  }
  function moveSel(dir) {
    var g = grid(), ri = -1, ci = -1;
    for (var i = 0; i < g.length; i++) { var j = g[i].indexOf(S.sel); if (j >= 0) { ri = i; ci = j; break; } }
    if (ri < 0) { render(); return; }
    if (dir === "down") ri = Math.min(g.length - 1, ri + 1);
    if (dir === "up") ri = Math.max(0, ri - 1);
    if (dir === "right") { if (ci < g[ri].length - 1) ci++; else if (ri < g.length - 1) { ri++; ci = 0; } }
    if (dir === "left") { if (ci > 0) ci--; else if (ri > 0) { ri--; ci = g[ri].length - 1; } }
    ci = Math.min(ci, g[ri].length - 1);
    S.sel = g[ri][ci];
    render();
    var td = tdOf(S.sel); if (td && td.scrollIntoView) td.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
  function isEditable(k) { var td = tdOf(k); return td && td.getAttribute("data-e") === "1"; }

  document.addEventListener("click", function (e) {
    var t = e.target;
    var tb = t.closest("[data-tab]"); if (tb) { if (S.edit && !commitEdit()) return; S.tab = tb.getAttribute("data-tab"); render(); return; }
    var ub = t.closest("[data-unit]"); if (ub) { if (S.edit && !commitEdit()) return; S.unit = ub.getAttribute("data-unit"); render(); return; }
    if (t.id === "save") { save(); return; }
    if (t.id === "discard") { S.pending = {}; S.undo = []; S.msg = ""; S.motif = ""; render(); return; }
    if (t.id === "fbOk") {
      var r = parseIn(document.getElementById("fbIn").value);
      if (!r.ok) { document.getElementById("fbIn").style.borderColor = "#C00000"; return; }
      setPending(S.sel, r.v); render(); return;
    }
    var go = t.closest("[data-go]");
    if (go) {
      var id = go.getAttribute("data-go"), tgt;
      if (id.charAt(0) === "a") { var x = M.alerts[+id.slice(1)]; tgt = [x.t, x.r, x.col]; } else tgt = M.cross[+id.slice(1)].go;
      S.tab = tgt[0]; S.sel = tgt.join("."); render();
      var td0 = tdOf(S.sel); if (td0 && td0.scrollIntoView) td0.scrollIntoView({ block: "center" });
      return;
    }
    var td = t.closest("td[data-k]");
    if (td && !td.classList.contains("ed")) {
      if (S.edit && !commitEdit()) return;
      S.sel = td.getAttribute("data-k"); render();
    }
  });
  document.addEventListener("dblclick", function (e) {
    var td = e.target.closest("td[data-k]");
    if (td && td.getAttribute("data-e") === "1") { S.sel = td.getAttribute("data-k"); render(); openEditor(S.sel); }
  });
  document.addEventListener("input", function (e) { if (e.target.id === "motif") S.motif = e.target.value; });
  document.addEventListener("keydown", function (e) {
    if (e.target.id === "motif") { if (e.key === "Enter") save(); return; }
    if (e.target.id === "fbIn") { if (e.key === "Enter") document.getElementById("fbOk").click(); return; }
    if (S.edit) {
      if (e.key === "Enter") { e.preventDefault(); commitEdit(e.shiftKey ? "up" : "down"); }
      else if (e.key === "Tab") { e.preventDefault(); commitEdit(e.shiftKey ? "left" : "right"); }
      else if (e.key === "Escape") { e.preventDefault(); cancelEdit(); }
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
      var u = S.undo.pop(); if (u) { if (u.had) S.pending[u.k] = u.prev; else delete S.pending[u.k]; S.sel = u.k; render(); }
      e.preventDefault(); return;
    }
    if (!S.sel) return;
    var map = { ArrowDown: "down", ArrowUp: "up", ArrowLeft: "left", ArrowRight: "right" };
    if (map[e.key]) { e.preventDefault(); moveSel(map[e.key]); return; }
    if (e.key === "Tab") { e.preventDefault(); moveSel(e.shiftKey ? "left" : "right"); return; }
    if (!isEditable(S.sel)) return;
    if (e.key === "Enter" || e.key === "F2") { e.preventDefault(); openEditor(S.sel); return; }
    if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); setPending(S.sel, null); render(); return; }
    if (/^[0-9\-,.(]$/.test(e.key) && !e.ctrlKey && !e.metaKey) { e.preventDefault(); S.edit = { k: S.sel, init: e.key }; openEditor(S.sel, e.key); }
  });

  function save() {
    var keys = Object.keys(S.pending);
    if (!keys.length) return;
    var m = (document.getElementById("motif") || {}).value || S.motif;
    if (!m || !m.trim()) { S.msg = "Motif obligatoire."; render(); var mi = document.getElementById("motif"); if (mi) mi.focus(); return; }
    S.motif = m; S.saving = true; S.msg = ""; render();
    send("streamlit:setComponentValue", {
      dataType: "json",
      value: { action: "save", nonce: Date.now() + "-" + Math.random().toString(36).slice(2), motif: m.trim(),
        changes: keys.map(function (k) { var p = k.split("."); return { table: p[0], row: p[1], col: p[2], value: S.pending[k].value }; }) }
    });
  }
})();
</script>
</body>
</html>
